      responses:
        "200":
          description: Everything the backups page shows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupOverview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [backups]
      summary: Make a full backup now
