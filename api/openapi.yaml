        - { name: month, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }, description: 'Empty: this month (UTC)' }
      responses:
        "200":
          description: The month's bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bandwidth" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/logs/{kind}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [access, error] } }
    get:
      tags: [stats]
