      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [folder, quota_mb]
              properties:
                folder: { type: string, description: 'Relative to the home; empty: the whole home' }
                quota_mb: { type: integer, minimum: 0 }
      responses:
        "202":
          description: Changed; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FTPAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [ftp]
      summary: Delete an FTP login (its files stay)
      operationId: deleteFTPAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /ftp/{id}/password:
    parameters:
