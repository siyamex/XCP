openapi: 3.1.0
info:
  title: XCP API
  version: 0.1.0
  description: |
    REST API of the XCP hosting panel. The web UI uses exactly this API.

    **Authentication.** Browsers log in with `POST /auth/login`, which sets an
    HttpOnly session cookie (`__Host-xcp_session`, or `xcp_session` in local
    development). Every request that changes state (anything but GET/HEAD)
    must also send the `X-CSRF-Token` header with the `csrf_token` value from
    the login response or from `GET /me`.

    **Errors.** All errors use RFC 9457 `application/problem+json`. Switch on
    the stable `code` field, not on the message.
  license:
    name: AGPL-3.0-only
servers:
  - url: /api/v1

tags:
  - name: auth
  - name: me
  - name: system
  - name: plans
  - name: accounts
  - name: dns
    description: |
      DNS zones served by this server. A zone is made for each domain from
      the zone template; users with the `dns_editor` feature edit their own.
      Record changes are applied by a job (`job_id`).
  - name: ssl
    description: |
      Certificates (ADR-0005). AutoSSL issues free certificates through ACME
      for domains that point here; users may upload their own. Private keys
      are never returned. Users need the `ssl` feature.
  - name: databases
    description: |
      MariaDB databases and users of an account (ADR-0006). Names carry the
      account's prefix (username and _). Changes are applied by a job
      (job_id). Users need the mysql feature, and phpmyadmin to sign in to
      phpMyAdmin.
  - name: mail
    description: |
      Mail of an account's domains (ADR-0007): mailboxes, forwarders, the
      default address, DKIM and the deliverability check. Changes are applied
      by a job (job_id). Users need the email feature.
  - name: server
    description: |
      The admin's view of the server (ADR-0014): dashboard figures and server
      information, the service manager, the job monitor, all sessions and the
      sign-in history. Admins only.
  - name: backups
    description: |
      Full account backups (ADR-0013): made by the agent into a root-only
      folder, downloaded through the panel. Users need the backups feature
      and keep up to 3 of their own; the admin's schedule keeps its own.
  - name: stats
    description: |
      Bandwidth per domain and month, counted by xcp-logd from the web,
      mail and FTP logs (feature stats), and the access and error logs of
      the account's sites (feature logs). ADR-0012.
  - name: cron
    description: |
      Cron jobs of an account (ADR-0011): run as the account's user in its
      slice by xcp-agent, on 5-field schedules in the server's time. Changes
      are applied by a job (job_id). Users need the cron feature.
  - name: ftp
    description: |
      FTP logins of an account (ADR-0010), named login@domain after one of
      the account's domains, each locked into a folder of the home. Changes
      are applied by a job (job_id). Users need the ftp feature.
  - name: files
    description: |
      The file manager (ADR-0009): an account's home folder, handled by its
      xcp-userd as the account's user. Paths are relative to the home folder.
      Users need the file_manager feature; the account must be active.
  - name: domains
    description: |
      An account's domains and redirects. Admins reach every admin-owned
      account; a user login reaches only its own account (`account_id` in
      `GET /me`), and only if its package's feature list has `domains`
      (or `redirects` for redirects).

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness check
      operationId: health
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with username and password
      description: |
        On success sets the session cookie. If `mfa_required` is true, the
        session is limited until `POST /auth/2fa/verify` succeeds (within 5 minutes).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/2fa/verify:
    post:
      tags: [auth]
      summary: Complete a login with a TOTP code or a recovery code
      operationId: verify2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "204": { description: Second factor accepted; the session is now fully usable. }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Logged out; the cookie is cleared. }
        "401": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      tags: [me]
      summary: The logged-in identity
      description: Also returns the CSRF token for this session.
      operationId: getMe
      responses:
        "200":
          description: Current login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/password:
    post:
      tags: [me]
      summary: Change the password
      description: Logs out every other session of this login.
      operationId: changePassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 1024 }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/reauth:
    post:
      tags: [me]
      summary: Confirm the password before a sensitive action
      operationId: reauth
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Confirmed. }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/tokens:
    get:
      tags: [auth]
      summary: The login's API tokens
      operationId: listTokens
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } }
    post:
      tags: [auth]
      summary: Make an API token
      description: The secret is shown once. Needs the login's password. At most 20 tokens per login.
      operationId: createToken
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [name, scope, password], properties: { name: { type: string }, scope: { type: string, enum: [read, write] }, expires_days: { type: integer, description: 0 never }, ip_allow: { type: array, items: { type: string } }, password: { type: string } } }
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewApiToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /me/tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoke an API token
      operationId: revokeToken
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Problem" }
  /me/sessions:
    get:
      tags: [me]
      summary: List this login's sessions
      operationId: listSessions
      responses:
        "200":
          description: Sessions, newest activity first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/sessions/{id}:
    delete:
      tags: [me]
      summary: End one of this login's sessions
      operationId: revokeSession
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204": { description: Session ended. }
        "404": { $ref: "#/components/responses/Problem" }

  /me/2fa/setup:
    post:
      tags: [me]
      summary: Start enabling two-factor authentication
      description: Returns a new secret. 2FA is not active until `/me/2fa/confirm`.
      operationId: setup2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Secret to add to an authenticator app.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: { type: string, description: Base32, for manual entry }
                  otpauth_uri: { type: string, description: Payload for a QR code }
        "409": { $ref: "#/components/responses/Problem" }

  /me/2fa/confirm:
    post:
      tags: [me]
      summary: Activate 2FA with a code from the app
      operationId: confirm2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: 2FA is active. Show the recovery codes once.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string, examples: ["ABCDE-FGHIJ"] }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /me/2fa/disable:
    post:
      tags: [me]
      summary: Turn 2FA off (requires the password)
      operationId: disable2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: 2FA disabled. }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /features:
    get:
      tags: [plans]
      summary: The feature catalog (admins)
      description: Every feature a feature list can turn on, in display order.
      operationId: listFeatures
      responses:
        "200":
          description: Features.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Feature" }
        "403": { $ref: "#/components/responses/Problem" }

  /feature-lists:
    get:
      tags: [plans]
      summary: List feature lists (admins)
      operationId: listFeatureLists
      responses:
        "200":
          description: Feature lists, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureList" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [plans]
      summary: Create a feature list
      operationId: createFeatureList
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureListInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureList" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /feature-lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [plans]
      summary: Get a feature list
      operationId: getFeatureList
      responses:
        "200":
          description: The feature list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureList" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [plans]
      summary: Replace a feature list
      operationId: updateFeatureList
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureListInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [plans]
      summary: Delete a feature list
      operationId: deleteFeatureList
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /packages:
    get:
      tags: [plans]
      summary: List packages (admins)
      operationId: listPackages
      responses:
        "200":
          description: Packages, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Package" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [plans]
      summary: Create a package
      operationId: createPackage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /packages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [plans]
      summary: Get a package
      operationId: getPackage
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [plans]
      summary: Replace a package
      operationId: updatePackage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [plans]
      summary: Delete a package
      operationId: deletePackage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts:
    get:
      tags: [accounts]
      summary: List hosting accounts (admins)
      operationId: listAccounts
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Part of a username or domain }
        - { name: status, in: query, schema: { type: string, enum: [creating, active, suspended, terminating, error] } }
      responses:
        "200":
          description: Accounts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [accounts]
      summary: Create a hosting account
      description: Creates the account and its login; a job then creates the Linux user (status creating, then active).
      operationId: createAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "202":
          description: Created; setup continues in the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [accounts]
      summary: Get an account
      operationId: getAccount
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [accounts]
      summary: Change package and contact email
      operationId: updateAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "202":
          description: Saved; limits are re-applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/suspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Suspend an account
      operationId: suspendAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Accepted; the change runs as the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/unsuspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Unsuspend an account
      operationId: unsuspendAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Accepted; the change runs as the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Set the account login's password
      operationId: setAccountPassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 10 }
                must_change: { type: boolean }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/terminate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Terminate (delete) an account
      operationId: terminateAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: string, description: Must equal the username }
      responses:
        "202":
          description: Accepted; the change runs as the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/domains:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domains]
      summary: List an account's domains, the primary first
      operationId: listDomains
      responses:
        "200":
          description: The domains.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Domain" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [domains]
      summary: Add an addon domain, subdomain or alias
      description: |
        `409 verification_required`: another account uses a domain under the
        same registered domain. Publish the TXT record from
        `GET /accounts/{id}/domain-verification` and try again.
        Other 409 codes: `domain_taken`, `limit_reached`, `bad_status`.
      operationId: addDomain
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainCreate" }
      responses:
        "202":
          description: Accepted; the websites are configured by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/domain-verification:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domains]
      summary: Whether adding a domain needs a TXT record, and which
      operationId: getDomainVerification
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The verification state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainVerification" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /domains/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
