        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/logs/{kind}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [access, error] } }
    get:
      tags: [stats]
      summary: Download the account's current access or error log
      operationId: downloadLog
      responses:
        "200":
          description: The log as it was when the download started.
          content:
            text/plain: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/cron:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [cron]
      summary: An account's cron jobs with their next and last runs
