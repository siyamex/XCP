          content:
            application/json:
              schema: { $ref: "#/components/schemas/FTPOverview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [ftp]
      summary: Create an FTP login
      description: Its folder is made, owned by the account's user, if it does not exist.
      operationId: createFTPAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain_id, name, password]
              properties:
                domain_id: { type: string }
                name: { type: string, description: The part before the @ }
                password: { type: string, format: password }
                folder: { type: string, description: 'Relative to the home; empty: the whole home' }
                quota_mb: { type: integer, minimum: 0, description: 0 means no quota of its own }
      responses:
        "202":
          description: Created; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FTPAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /ftp/{id}:
    parameters:
