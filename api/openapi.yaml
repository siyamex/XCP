            application/json:
              schema: { $ref: "#/components/schemas/CronOverview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [cron]
      summary: Add a cron job
      operationId: createCronJob
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronJobInput" }
      responses:
        "202":
          description: Created; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJob" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /cron/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [cron]
      summary: Change a cron job
      operationId: updateCronJob
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronJobInput" }
      responses:
        "202":
          description: Changed; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJob" }
