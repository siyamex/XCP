        "202":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, schema: { type: string }, description: Relative to the account's home; empty is the home }
    get:
      tags: [files]
      summary: List a folder
      operationId: listFiles
      responses:
        "200":
          description: The folder and what is in it, folders first.
          content:
            application/json:
              schema:
                type: object
                required: [dir, items]
                properties:
                  dir: { $ref: "#/components/schemas/FileEntry" }
                  items: { type: array, items: { $ref: "#/components/schemas/FileEntry" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
      - { name: inline, in: query, schema: { type: string, enum: ["1"] }, description: Show PNG, JPEG, GIF or WebP images instead of saving }
    get:
      tags: [files]
      summary: Download a file
      operationId: downloadFile
      responses:
        "200":
          description: The file's content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
      - { name: overwrite, in: query, schema: { type: boolean } }
    put:
      tags: [files]
      summary: Upload a file (the raw body, up to 4 GB; missing folders are made)
      operationId: uploadFile
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files/{op}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: op, in: path, required: true, schema: { type: string, enum: [mkdir, rename, copy, trash, chmod, compress, extract] } }
    post:
      tags: [files]
      summary: Change files
      description: |
        mkdir {path}; rename {from, to}; copy {from, to}; trash {paths} (moves
        them into ~/.trash); chmod {path, mode ("644"), recursive}; compress
        {paths, to, format: zip | tar.gz}; extract {path, to} (zip, tar,
        tar.gz, tgz, tar.zst, 7z, into a new folder). Nothing is ever replaced.
      operationId: fileOp
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The new or changed entry ({trash} for trash).
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, schema: { type: string } }
      - { name: q, in: query, required: true, schema: { type: string } }
    get:
      tags: [files]
      summary: Find files and folders whose names contain q (up to 500)
      operationId: searchFiles
      responses:
        "200":
          description: Matches; more is true when there were more.
          content:
            application/json:
              schema:
                type: object
                required: [items, more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileEntry" } }
                  more: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files/usage:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, schema: { type: string } }
    get:
      tags: [files]
      summary: What takes space below a folder
      operationId: fileUsage
      responses:
        "200":
          description: Sizes of what is in the folder, and the largest files below it.
          content:
            application/json:
              schema:
                type: object
                required: [path, total, children, largest, partial]
                properties:
                  path: { type: string }
                  total: { type: integer }
                  children: { type: array, items: { $ref: "#/components/schemas/FileEntry" } }
                  largest: { type: array, items: { $ref: "#/components/schemas/FileEntry" } }
                  partial: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/files/text:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      tags: [files]
      summary: Open a text file in the editor (up to 2 MB)
      operationId: readFileText
      parameters:
        - { name: encoding, in: query, schema: { type: string, enum: [utf-8, iso-8859-1, iso-8859-15, windows-1252] }, description: Empty guesses }
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileText" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    put:
      tags: [files]
      summary: Save the editor's text (makes the file if needed)
      operationId: writeFileText
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileText" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /jobs/{id}:
    get:
      tags: [system]
      summary: Status of a background job (admins; users for their own account's jobs)
      operationId: getJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Problem" }

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-xcp_session
    bearerToken:
      type: http
      scheme: bearer
      description: An API token made under /me/tokens (xcp_...). Read tokens can only GET; no token can use /me/* (except GET /me) or /auth/*. No CSRF token is needed.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The `csrf_token` from the login response or `GET /me`. Required with the session cookie on state-changing requests.

  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    LoginResult:
      type: object
      required: [mfa_required, must_change_password, csrf_token]
      properties:
        mfa_required: { type: boolean }
        must_change_password: { type: boolean }
        csrf_token: { type: string }

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: "6-digit TOTP code or a recovery code" }

    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string }

    Me:
      type: object
      required: [id, username, role, email, locale, totp_enabled, must_change_password, mfa_enrollment_required, csrf_token]
      properties:
        id: { type: string, description: ULID }
        username: { type: string }
        role: { type: string, enum: [admin, reseller, user, subuser] }
        email: { type: string }
        locale: { type: string }
        totp_enabled: { type: boolean }
        mfa_enrollment_required: { type: boolean, description: "The server requires two-factor sign-in for this login and it is not set up: only the pages to set it up work" }
        must_change_password: { type: boolean }
        impersonator_id: { type: string, description: Set while an admin or reseller is logged in as this user }
        account_id: { type: string, description: The hosting account of a user login }
        csrf_token: { type: string }

    Session:
      type: object
      required: [id, ip, user_agent, created_at, last_seen_at, current]
      properties:
        id: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }

    Feature:
      type: object
      required: [key, group]
      properties:
        key: { type: string, examples: [email] }
        group: { type: string, examples: [email] }

    FeatureList:
      type: object
      required: [id, name, features, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        features:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FeatureListInput:
      type: object
      additionalProperties: false
      required: [name, features]
      properties:
        name: { type: string, maxLength: 64 }
        features:
          type: array
          items: { type: string }

    Limits:
      type: object
      additionalProperties: false
      description: Resource limits. null means unlimited.
      properties:
        disk_mb: { type: [integer, "null"], minimum: 0, description: "Disk space in MB" }
        inodes: { type: [integer, "null"], minimum: 0, description: "Number of files" }
        bandwidth_mb: { type: [integer, "null"], minimum: 0, description: "Monthly traffic in MB" }
        addon_domains: { type: [integer, "null"], minimum: 0, description: "Addon domains" }
        subdomains: { type: [integer, "null"], minimum: 0, description: "Subdomains" }
        aliases: { type: [integer, "null"], minimum: 0, description: "Alias (parked) domains" }
        mailboxes: { type: [integer, "null"], minimum: 0, description: "Mailboxes" }
        mailbox_mb: { type: [integer, "null"], minimum: 0, description: "Largest quota of one mailbox, MB" }
        forwarders: { type: [integer, "null"], minimum: 0, description: "Mail forwarders" }
        mail_per_hour: { type: [integer, "null"], minimum: 0, description: "Outgoing mails per hour" }
        databases: { type: [integer, "null"], minimum: 0, description: "Databases" }
        db_users: { type: [integer, "null"], minimum: 0, description: "Database users" }
        ftp_accounts: { type: [integer, "null"], minimum: 0, description: "FTP accounts" }
        cron_jobs: { type: [integer, "null"], minimum: 0, description: "Cron jobs" }
        cpu_percent: { type: [integer, "null"], minimum: 0, description: "CPU, 100 = one core" }
        memory_mb: { type: [integer, "null"], minimum: 0, description: "Memory in MB" }
        processes: { type: [integer, "null"], minimum: 0, description: "Processes" }
        io_mbps: { type: [integer, "null"], minimum: 0, description: "Disk I/O in MB/s" }
        shell: { type: string, enum: [none, jailed, full] }
        php_versions:
          type: array
          description: Allowed PHP versions; empty means all installed.
          items: { type: string, pattern: "^[5-9]\\.[0-9]$" }
        dedicated_ip: { type: boolean }

    Package:
      type: object
      required: [id, name, feature_list_id, limits, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        feature_list_id: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PackageInput:
      type: object
      additionalProperties: false
      required: [name, feature_list_id, limits]
      properties:
        name: { type: string, maxLength: 64 }
        feature_list_id: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }

    Account:
      type: object
      required: [id, username, uid, primary_domain, email, php_version, package_id, package_name, status, status_detail, created_at, updated_at]
      properties:
        id: { type: string }
        username: { type: string }
        uid: { type: integer }
        primary_domain: { type: string }
        email: { type: string }
        php_version: { type: string, description: '"" = server default (newest installed)' }
        package_id: { type: string }
        package_name: { type: string }
        status: { type: string, enum: [creating, active, suspended, terminating, error] }
        status_detail: { type: string, description: Suspension reason or last error }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        job_id: { type: string, description: Job started by this change }

    AccountCreate:
      type: object
      additionalProperties: false
      required: [username, domain, package_id, password]
      properties:
        username: { type: string, pattern: "^[a-z][a-z0-9]{0,15}$" }
        domain: { type: string }
        package_id: { type: string }
        email: { type: string }
        password: { type: string, minLength: 10 }
        php_version: { type: string, description: 'Installed version the package allows; "" or omitted = server default' }

    AccountUpdate:
      type: object
      additionalProperties: false
      required: [package_id, email]
      properties:
        package_id: { type: string }
        email: { type: string }
        php_version: { type: string }

    Job:
      type: object
      required: [id, kind, status, progress, attempts, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        attempts: { type: integer }
        error: { type: string }
        result: { type: object, additionalProperties: true }
        account_id: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    NameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, description: With or without the account's prefix }

    PasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password }

    DatabaseAccess:
      type: object
      required: [id, name, privileges]
      properties:
        id: { type: string, description: The other side's ID (user in a Database, database in a DatabaseUser) }
        name: { type: string }
        privileges: { type: array, items: { type: string } }

    Database:
      type: object
      required: [id, account_id, name, size_bytes, users, created_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        name: { type: string, description: Full name with the account's prefix }
        size_bytes: { type: [integer, "null"], description: Data and indexes; null when the server did not say }
        users: { type: array, items: { $ref: "#/components/schemas/DatabaseAccess" } }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    DatabaseUser:
      type: object
      required: [id, account_id, name, databases, created_at, updated_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        name: { type: string }
        databases: { type: array, items: { $ref: "#/components/schemas/DatabaseAccess" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        job_id: { type: string }

    DatabaseOverview:
      type: object
      required: [prefix, databases, users, privileges, max_databases, max_users, server, host, phpmyadmin]
      properties:
        prefix: { type: string }
        databases: { type: array, items: { $ref: "#/components/schemas/Database" } }
        users: { type: array, items: { $ref: "#/components/schemas/DatabaseUser" } }
        privileges: { type: array, items: { type: string } }
        max_databases: { type: [integer, "null"] }
        max_users: { type: [integer, "null"] }
        server: { type: string, description: ok, or why sizes are missing }
        host: { type: string }
        phpmyadmin: { type: boolean, description: The caller may open phpMyAdmin }

    MailDomain:
      type: object
      required: [id, name, display_name, kind, routing, catch_all, dkim]
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        kind: { type: string }
        routing: { type: string, enum: [local, remote, backup], description: The zone's email routing }
        alias_of: { type: string }
        catch_all: { type: array, items: { type: string }, description: Where unknown addresses go; empty rejects them }
        dkim: { type: boolean }

    FirewallPort:
      type: object
      required: [port, proto, comment]
      properties:
        port: { type: string, description: A port or a range like 30000-30999 }
        proto: { type: string, enum: [tcp, udp] }
        comment: { type: string }
    FirewallEntry:
      type: object
      required: [cidr, comment]
      properties:
        cidr: { type: string }
        comment: { type: string }
    FirewallConfig:
      type: object
      required: [enabled, policy, ssh_port, ports, allow, deny, restrict, rate_limit, brute]
      properties:
        enabled: { type: boolean }
        policy: { type: string, enum: [open, closed] }
        ssh_port: { type: integer }
        ports: { type: array, items: { $ref: "#/components/schemas/FirewallPort" } }
        allow: { type: array, items: { $ref: "#/components/schemas/FirewallEntry" } }
        deny: { type: array, items: { $ref: "#/components/schemas/FirewallEntry" } }
        restrict: { type: object, additionalProperties: { type: array, items: { type: string } }, description: Service (panel, ssh, ftp) to the networks that may reach it }
        rate_limit:
          type: object
          required: [enabled, per_minute, ports]
          properties:
            enabled: { type: boolean }
            per_minute: { type: integer }
            ports: { type: array, items: { type: string } }
        brute:
          type: object
          required: [enabled, threshold, window_minutes, ban_minutes, permanent_after, sources]
          properties:
            enabled: { type: boolean }
            threshold: { type: integer }
            window_minutes: { type: integer }
            ban_minutes: { type: integer }
            permanent_after: { type: integer }
            sources: { type: array, items: { type: string, enum: [ssh, mail, ftp, panel] } }
    FirewallBan:
      type: object
      required: [id, ip, reason, source, created_at, expires_at, released_at, released_by, active]
      properties:
        id: { type: string }
        ip: { type: string }
        reason: { type: string }
        source: { type: string, enum: [ssh, mail, ftp, panel, manual] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        released_at: { type: [string, "null"], format: date-time }
        released_by: { type: string }
        active: { type: boolean }
    FirewallOverview:
      type: object
      required: [config, bans, history, your_ip, panel_port]
      properties:
        config: { $ref: "#/components/schemas/FirewallConfig" }
        bans: { type: array, items: { $ref: "#/components/schemas/FirewallBan" } }
        history: { type: array, items: { $ref: "#/components/schemas/FirewallBan" } }
        your_ip: { type: string }
        panel_port: { type: integer }
    WebSettings:
      type: object
      required: [error_pages, hotlink, blocked, compress, cache_rules]
      properties:
        error_pages: { type: object, additionalProperties: { type: string }, description: "Status code (400, 401, 403, 404, 500, 502, 503) to the URL path of the page, like /errors/404.html" }
        hotlink:
          type: object
          required: [enabled, hosts, extensions, allow_empty]
          properties:
            enabled: { type: boolean }
            hosts: { type: array, items: { type: string }, description: Other sites that may embed the files }
            extensions: { type: array, items: { type: string }, description: Protected file types }
            allow_empty: { type: boolean, description: Requests without a referrer pass }
        blocked: { type: array, items: { type: string }, description: Addresses and networks that get 403 }
        compress: { type: boolean }
        cache_rules:
          type: array
          items:
            type: object
            required: [extensions, days]
            properties:
              extensions: { type: array, items: { type: string } }
              days: { type: integer, minimum: 1, maximum: 365 }
        job_id: { type: string }
    ApiToken:
      type: object
      required: [id, name, prefix, scope, ip_allow, created_at, expires_at, last_used_at, last_used_ip]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: The start of the token, to recognise it }
        scope: { type: string, enum: [read, write] }
        ip_allow: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        last_used_ip: { type: string }
    NewApiToken:
      allOf:
        - { $ref: "#/components/schemas/ApiToken" }
        - { type: object, required: [secret], properties: { secret: { type: string, description: The whole token; shown only now } } }
    SettingItem:
      type: object
      required: [key, group, type, value, default, min, max, options]
      properties:
        key: { type: string }
        group: { type: string }
        type: { type: string, enum: [int, bool, string, enum] }
        value: {}
        default: {}
        min: { type: integer }
        max: { type: integer }
        options: { type: array, items: { type: string } }

    ServerSetup:
      type: object
      required: [completed, hostname, admin_email, timezone, nameservers, ipv4, ipv6]
      properties:
        completed: { type: boolean }
        hostname: { type: string }
        admin_email: { type: string }
        timezone: { type: string }
        nameservers: { type: array, items: { type: string } }
        ipv4: { type: string }
        ipv6: { type: string }

    SetupInput:
      type: object
      additionalProperties: false
      properties:
        hostname: { type: string }
        admin_email: { type: string }
        timezone: { type: string, description: A tz database name like Europe/Berlin }
        nameservers: { type: array, items: { type: string } }
        ipv4: { type: string }
        ipv6: { type: string }

    HostnameResult:
      type: object
      required: [hostname, changed]
      properties:
        hostname: { type: string }
        changed: { type: boolean }
        job_id: { type: string }

    UpdateInfo:
      type: object
      required: [current, latest, channel, url, available, development, checked_at]
      properties:
        current: { type: string }
        latest: { type: string }
        channel: { type: string }
        url: { type: string }
        available: { type: boolean }
        development: { type: boolean, description: "A build from source: nothing to compare" }
        checked_at: { type: string, format: date-time }
        error: { type: string }

    OrphanBackup:
      type: object
      required: [id, username, kind, file, size, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        kind: { type: string }
        file: { type: string }
        size: { type: integer }
        created_at: { type: string, format: date-time }

    ServerStatus:
      type: object
      required: [hostname, os, kernel, arch, cpu_model, cores, uptime_seconds, load, cpu_percent, mem_total, mem_available, swap_total, swap_free, disks, net, procs, accounts, accounts_at, accounts_computing, versions, xcp_version, jobs]
      properties:
        hostname: { type: string }
        os: { type: string }
        kernel: { type: string }
        arch: { type: string }
        cpu_model: { type: string }
        cores: { type: integer }
        uptime_seconds: { type: integer }
        load: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: 1, 5 and 15 minutes }
        cpu_percent: { type: number }
        mem_total: { type: integer }
        mem_available: { type: integer }
        swap_total: { type: integer }
        swap_free: { type: integer }
        disks:
          type: array
          items:
            type: object
            required: [mount, device, fs, total, used, files, files_used]
            properties:
              mount: { type: string }
              device: { type: string }
              fs: { type: string }
              total: { type: integer }
              used: { type: integer }
              files: { type: integer }
              files_used: { type: integer }
        net:
          type: array
          items:
            type: object
            required: [name, rx_bytes, tx_bytes]
            properties: { name: { type: string }, rx_bytes: { type: integer }, tx_bytes: { type: integer } }
        procs:
          type: array
          items:
            type: object
            required: [pid, name, user, cpu_percent, rss]
            properties: { pid: { type: integer }, name: { type: string }, user: { type: string }, cpu_percent: { type: number }, rss: { type: integer } }
        accounts:
          type: array
          description: Biggest first
          items:
            type: object
            required: [username, bytes, partial]
            properties: { username: { type: string }, bytes: { type: integer }, partial: { type: boolean } }
        accounts_at: { type: [string, "null"], format: date-time, description: When the accounts' disk use was measured }
        accounts_computing: { type: boolean }
        versions:
          type: array
          items:
            type: object
            required: [package, version]
            properties: { package: { type: string }, version: { type: string } }
        xcp_version: { type: string }
        jobs: { type: object, additionalProperties: { type: integer }, description: Jobs by status; the last 24 hours and all queued or running }

    ServiceState:
      type: object
      required: [id, unit, installed, state, sub_state, enabled, main_pid, protected, can_restart]
      properties:
        id: { type: string }
        unit: { type: string }
        installed: { type: boolean }
        state: { type: string, description: systemd's active state }
        sub_state: { type: string }
        enabled: { type: boolean }
        main_pid: { type: integer }
        protected: { type: boolean }
        can_restart: { type: boolean }

    JobItem:
      type: object
      required: [id, kind, status, progress, attempts, max_attempts, account_id, created_by, error, created_at, started_at, finished_at]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        progress: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        account_id: { type: string }
        created_by: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    AnySession:
      type: object
      required: [id, username, role, ip, user_agent, created_at, last_seen_at, expires_at, mfa_passed, impersonated, current]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        mfa_passed: { type: boolean }
        impersonated: { type: boolean }
        current: { type: boolean }

    LoginAttempt:
      type: object
      required: [at, username, result, step, ip, user_agent, reason]
      properties:
        at: { type: string, format: date-time }
        username: { type: string }
        result: { type: string, enum: [ok, denied, error] }
        step: { type: string, enum: [login, password], description: password is the first step of a login with 2FA }
        ip: { type: string }
        user_agent: { type: string }
        reason: { type: string }

    Backup:
      type: object
      required: [id, kind, status, file, size, detail, created_at, finished_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [manual, scheduled] }
        status: { type: string, enum: [running, ok, failed] }
        file: { type: string }
        size: { type: integer }
        detail: { type: string, description: Why it failed, or what it left out }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        job_id: { type: string }

    BackupSchedule:
      type: object
      additionalProperties: false
      required: [enabled, frequency, hour, weekday, day, keep]
      properties:
        enabled: { type: boolean }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        hour: { type: integer, minimum: 0, maximum: 23, description: Server time }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 'Weekly: 0 is Sunday' }
        day: { type: integer, minimum: 1, maximum: 28, description: 'Monthly: the day of the month' }
        keep: { type: integer, minimum: 1, maximum: 90, description: Scheduled backups kept per account }

    BackupOverview:
      type: object
      required: [backups, max_manual, schedule]
      properties:
        backups: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        max_manual: { type: integer }
        schedule: { $ref: "#/components/schemas/BackupSchedule" }

    Bytes:
      type: object
      required: [web, mail, ftp, total]
      properties:
        web: { type: integer }
        mail: { type: integer }
        ftp: { type: integer }
        total: { type: integer }

    Bandwidth:
      type: object
      required: [month, limit_mb, total, domains, days]
      properties:
        month: { type: string }
        limit_mb: { type: [integer, "null"], description: The package's monthly limit; null means unlimited }
        total: { $ref: "#/components/schemas/Bytes" }
        domains:
          type: array
          description: Biggest first
          items:
            allOf:
              - { $ref: "#/components/schemas/Bytes" }
              - { type: object, required: [domain], properties: { domain: { type: string } } }
        days:
          type: array
          description: Every day of the month up to today (UTC)
          items:
            allOf:
              - { $ref: "#/components/schemas/Bytes" }
              - { type: object, required: [day], properties: { day: { type: string } } }

    CronOverview:
      type: object
      required: [jobs, max_jobs, time_zone, default_email]
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/CronJob" } }
        max_jobs: { type: [integer, "null"], description: null means unlimited }
        time_zone: { type: string, description: The server's time zone; schedules use it }
        default_email: { type: string, description: The account's contact address }
        status_error: { type: string, description: Set when the last runs could not be read }

    CronJobInput:
      type: object
      additionalProperties: false
      required: [schedule, command]
      properties:
        schedule: { type: string, description: '5 fields (minute hour day month weekday) or @hourly, @daily, @weekly, @monthly, @yearly' }
        command: { type: string, description: One line, run with /bin/sh as the account's user from its home }
        email: { type: string, description: 'Mail the output here; empty: keep it only' }
        enabled: { type: boolean, description: Default true }

    CronJob:
      type: object
      required: [id, schedule, command, email, enabled, next_runs, last_run, created_at]
      properties:
        id: { type: string }
        schedule: { type: string }
        command: { type: string }
        email: { type: string }
        enabled: { type: boolean }
        next_runs: { type: array, items: { type: string, format: date-time } }
        last_run:
          oneOf:
            - { $ref: "#/components/schemas/CronRun" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    CronRun:
      type: object
      required: [start, duration_ms, exit_code, output]
      properties:
        start: { type: string, format: date-time }
        duration_ms: { type: integer }
        exit_code: { type: integer }
        output: { type: string, description: The last 16 KiB }
        skipped: { type: string, description: Set when the run did not start, and why }

    FTPOverview:
      type: object
      required: [domains, logins, max_logins, server, port]
      properties:
        domains:
          type: array
          items:
            type: object
            required: [id, name, display_name]
            properties:
              id: { type: string }
              name: { type: string }
              display_name: { type: string }
        logins: { type: array, items: { $ref: "#/components/schemas/FTPAccount" } }
        max_logins: { type: [integer, "null"], description: null means unlimited }
        server: { type: string, description: The host name FTP clients connect to }
        port: { type: integer }

    FTPAccount:
      type: object
      required: [id, domain_id, login, folder, quota_mb, created_at]
      properties:
        id: { type: string }
        domain_id: { type: string }
        login: { type: string, description: name@domain }
        folder: { type: string, description: 'Relative to the home; "." is the home' }
        quota_mb: { type: integer, description: 0 means no quota of its own }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    Mailbox:
      type: object
      required: [id, domain_id, address, quota_mb, login, receive, send, created_at]
      properties:
        id: { type: string }
        domain_id: { type: string }
        address: { type: string }
        quota_mb: { type: integer, description: 0 means no limit of its own }
        login: { type: boolean }
        receive: { type: boolean }
        send: { type: boolean }
        autoresponder:
          oneOf:
            - { $ref: "#/components/schemas/Autoresponder" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    Autoresponder:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string }
        body: { type: string }
        start: { type: string, description: 'YYYY-MM-DD; empty: from now' }
        end: { type: string, description: 'YYYY-MM-DD, inclusive; empty: until removed' }
        days: { type: integer, minimum: 0, maximum: 30, description: At most one reply per sender in this many days (0 means 1) }

    Forwarder:
      type: object
      required: [id, domain_id, address, to, created_at]
      properties:
        id: { type: string }
        domain_id: { type: string }
        address: { type: string }
        to: { type: array, items: { type: string } }
        fail: { type: string }
        pipe: { type: string }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    MailOverview:
      type: object
      required: [domains, mailboxes, forwarders, max_mailboxes, max_forwarders, max_quota_mb, server]
      properties:
        domains: { type: array, items: { $ref: "#/components/schemas/MailDomain" } }
        mailboxes: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
        forwarders: { type: array, items: { $ref: "#/components/schemas/Forwarder" } }
        max_mailboxes: { type: [integer, "null"] }
        max_forwarders: { type: [integer, "null"] }
        max_quota_mb: { type: [integer, "null"] }
        server: { type: string, description: The host name mail clients connect to }

    DeliverabilityCheck:
      type: object
      required: [name, status, found, detail]
      properties:
        name: { type: string, enum: [mx, spf, dkim, dmarc, ptr] }
        status: { type: string, enum: [ok, warning, error] }
        found: { type: array, items: { type: string } }
        expected: { type: string }
        detail: { type: string }

    Deliverability:
      type: object
      required: [domain_id, domain, routing, checks, repairable]
      properties:
        domain_id: { type: string }
        domain: { type: string }
        routing: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/DeliverabilityCheck" } }
        repairable: { type: boolean, description: This server serves the domain's DNS }

    MailSettings:
      type: object
      required: [hostname, max_message_mb, relay_host, relay_user, has_relay_password, rbls, helo_checks, greylisting]
      properties:
        hostname: { type: string }
        max_message_mb: { type: integer }
        relay_host: { type: string }
        relay_user: { type: string }
        has_relay_password: { type: boolean }
        rbls: { type: array, items: { type: string } }
        helo_checks: { type: boolean }
        greylisting: { type: boolean }

    FileEntry:
      type: object
      required: [name, path, type, size, mode, mod_time, owner, group]
      properties:
        name: { type: string }
        path: { type: string, description: Relative to the home folder }
        type: { type: string, enum: [file, dir, link, other] }
        size: { type: integer }
        mode: { type: string, examples: ["0644"] }
        mod_time: { type: string, format: date-time }
        owner: { type: string }
        group: { type: string }

    FileText:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string }
        encoding: { type: string, enum: [utf-8, iso-8859-1, iso-8859-15, windows-1252] }

    JobRef:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string }

    Domain:
      type: object
      required: [id, account_id, name, display_name, kind, docroot, canonical, created_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        name: { type: string, description: 'ASCII (punycode); "*.example.com" for a wildcard subdomain' }
        display_name: { type: string, description: Unicode form of an internationalised name }
        kind: { type: string, enum: [primary, addon, sub, alias] }
        parent_id: { type: string, description: "sub: the domain it is under; alias: the domain whose site it shows" }
        parent_name: { type: string }
        docroot: { type: string, description: Relative to the home folder; for an alias, that of the site it shows }
        canonical: { type: string, enum: ["", www, bare], description: '"" serves both names; www or bare redirects to that form' }
        created_at: { type: string, format: date-time }
        job_id: { type: string, description: Job started by this change }

    DomainCreate:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [addon, sub, alias] }
        name: { type: string, description: 'addon/alias: the domain; sub: the part before the parent ("blog", or "*" for a wildcard)' }
        parent_id: { type: string, description: "sub and alias: the account's primary or addon domain" }
        docroot: { type: string, description: 'addon and sub, relative to the home folder; "" = domains/<name>' }

    DomainUpdate:
      type: object
      additionalProperties: false
      required: [docroot, canonical]
      properties:
        docroot: { type: string, description: Must be "" for an alias }
        canonical: { type: string, enum: ["", www, bare] }

    DomainVerification:
      type: object
      required: [name, required, record, value, verified]
      properties:
        name: { type: string }
        required: { type: boolean, description: Another account uses a domain under the same registered domain }
        record: { type: string, description: TXT record name to publish }
        value: { type: string, description: TXT record value }
        verified: { type: boolean, description: The record is visible in DNS now }

    Redirect:
      type: object
      required: [id, domain_id, domain, path, target, code, keep_path, created_at]
      properties:
        id: { type: string }
        domain_id: { type: string }
        domain: { type: string }
        path: { type: string, description: '"/" = the whole site' }
        target: { type: string }
        code: { type: integer, enum: [301, 302, 307, 308] }
        keep_path: { type: boolean, description: Append the rest of the requested path to the target }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    Zone:
      type: object
      required: [id, account_id, account, name, display_name, mail_routing, serving, updated_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        account: { type: string, description: The account's username }
        serving: { type: boolean, description: "The DNS server has the zone; false until PowerDNS has applied it" }
        name: { type: string }
        display_name: { type: string }
        mail_routing: { type: string, enum: [auto, local, remote, backup] }
        mail_routing_effective: { type: string, enum: [local, remote, backup], description: What auto resolves to from the MX records (detail only) }
        nameservers: { type: array, items: { type: string }, description: The zone's NS records (detail only) }
        records: { type: array, items: { $ref: "#/components/schemas/Record" }, description: Detail only }
        updated_at: { type: string, format: date-time }

    Record:
      type: object
      required: [id, zone_id, name, type, ttl, content, managed]
      properties:
        id: { type: string }
        zone_id: { type: string }
        name: { type: string, description: 'Relative to the zone: "@" for the zone itself' }
        type: { type: string, enum: [A, AAAA, CAA, CNAME, HTTPS, MX, NS, SRV, SVCB, TLSA, TXT] }
        ttl: { type: integer }
        content: { type: string, description: TXT as plain text; others in zone-file form }
        managed: { type: boolean, description: Made for a domain; removed with it }
        job_id: { type: string }

    RecordInput:
      type: object
      additionalProperties: false
      required: [name, type, content]
      properties:
        name: { type: string, description: '"@", "www", or a full name in the zone' }
        type: { type: string, enum: [A, AAAA, CAA, CNAME, HTTPS, MX, NS, SRV, SVCB, TLSA, TXT] }
        ttl: { type: integer, description: "Seconds, 60 to 604800; 0 or missing = the server's default" }
        content: { type: string, description: 'TXT: plain text. Others: zone-file form; for the host name, "@" is the zone, one label ("mail") is in the zone, a name with dots is complete' }

    DNSSettings:
      type: object
      required: [nameservers, ipv4, ipv6, ttl, template]
      properties:
        nameservers: { type: array, items: { type: string }, description: "NS of every zone; empty = ns1/ns2 of each zone" }
        ipv4: { type: string, description: "This server's public IPv4, used by the template" }
        ipv6: { type: string }
        ttl: { type: integer }
        template:
          type: array
          items:
            type: object
            required: [name, type, content]
            properties:
              name: { type: string }
              type: { type: string }
              content: { type: string, description: "May use {domain}, {ip4} and {ip6}" }

    SSLSettings:
      type: object
      required: [enabled, provider, directory_url, ca_bundle, eab_key_id, has_eab_key, email, hostname]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [letsencrypt, letsencrypt-staging, custom] }
        directory_url: { type: string, description: "custom: the ACME directory (https)" }
        ca_bundle: { type: string, description: "custom: PEM CA certificates the directory's HTTPS is signed with, if not public" }
        eab_key_id: { type: string, description: "custom: External Account Binding key ID" }
        has_eab_key: { type: boolean, description: The EAB key is stored (it is never returned) }
        email: { type: string }
        hostname: { type: string, description: "The server's own name: its certificate is used by the panel; accounts cannot add it" }

    SSLSettingsInput:
      type: object
      additionalProperties: false
      required: [enabled, provider]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [letsencrypt, letsencrypt-staging, custom] }
        directory_url: { type: string }
        ca_bundle: { type: string }
        eab_key_id: { type: string }
        eab_key: { type: string, description: "base64url HMAC key; empty keeps the stored one" }
        clear_eab_key: { type: boolean }
        email: { type: string }
        hostname: { type: string }

    Certificate:
      type: object
      required: [id, domain, source, names, issuer, not_before, not_after, days_left]
      properties:
        id: { type: string }
        domain: { type: string, description: '"" for the server''s own certificate' }
        account_id: { type: string }
        account: { type: string }
        source: { type: string, enum: [acme, upload] }
        names: { type: array, items: { type: string } }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        days_left: { type: integer }

    DomainSSL:
      type: object
      required: [domain_id, domain, display_name, kind, autossl, force_https, status, detail]
      properties:
        domain_id: { type: string }
        domain: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [primary, addon, sub, alias] }
        autossl: { type: boolean, description: false = left out of AutoSSL }
        force_https: { type: boolean }
        status: { type: string, enum: ["", ok, failed, skipped], description: AutoSSL's last result }
        detail: { type: string, description: Why (shown to the user) }
        checked_at: { type: string, format: date-time }
        certificate: { $ref: "#/components/schemas/Certificate" }
        job_id: { type: string }

    RedirectCreate:
      type: object
      additionalProperties: false
      required: [path, target, code]
      properties:
        path: { type: string }
        target: { type: string, description: Absolute http(s) URL }
        code: { type: integer, enum: [301, 302, 307, 308] }
        keep_path: { type: boolean }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable error code.
          examples: [invalid_credentials, unauthenticated, mfa_required, invalid_code, csrf_failed, rate_limited, validation_failed, password_change_required, forbidden, name_taken, in_use, username_taken, domain_taken, bad_status, limit_reached, rename_refused, not_installed, address_taken, no_zone, login_off, not_ready, exists, too_large, too_many, login_taken, busy, protected, bad_state, account_exists, not_ready]
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
