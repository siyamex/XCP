openapi: 3.1.0
info:
  title: XCP API
  version: 0.1.0
  description: |
    REST API of the XCP hosting panel. The web UI uses exactly this API.

    **Authentication.** Browsers log in with `POST /auth/login`, which sets an
    HttpOnly session cookie (`__Host-xcp_session`, or `xcp_session` in local
    development). Every request that changes state (anything but GET/HEAD)
    must also send the `X-CSRF-Token` header with the `csrf_token` value from
    the login response or from `GET /me`.

    **Errors.** All errors use RFC 9457 `application/problem+json`. Switch on
    the stable `code` field, not on the message.
  license:
    name: AGPL-3.0-only
servers:
  - url: /api/v1

tags:
  - name: auth
  - name: me
  - name: system
  - name: plans
  - name: accounts
  - name: dns
    description: |
      DNS zones served by this server. A zone is made for each domain from
      the zone template; users with the `dns_editor` feature edit their own.
      Record changes are applied by a job (`job_id`).
  - name: domains
    description: |
      An account's domains and redirects. Admins reach every admin-owned
      account; a user login reaches only its own account (`account_id` in
      `GET /me`), and only if its package's feature list has `domains`
      (or `redirects` for redirects).

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness check
      operationId: health
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with username and password
      description: |
        On success sets the session cookie. If `mfa_required` is true, the
        session is limited until `POST /auth/2fa/verify` succeeds (within 5 minutes).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/2fa/verify:
    post:
      tags: [auth]
      summary: Complete a login with a TOTP code or a recovery code
      operationId: verify2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "204": { description: Second factor accepted; the session is now fully usable. }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Logged out; the cookie is cleared. }
        "401": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      tags: [me]
      summary: The logged-in identity
      description: Also returns the CSRF token for this session.
      operationId: getMe
      responses:
        "200":
          description: Current login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/password:
    post:
      tags: [me]
      summary: Change the password
      description: Logs out every other session of this login.
      operationId: changePassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 1024 }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/reauth:
    post:
      tags: [me]
      summary: Confirm the password before a sensitive action
      operationId: reauth
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Confirmed. }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/sessions:
    get:
      tags: [me]
      summary: List this login's sessions
      operationId: listSessions
      responses:
        "200":
          description: Sessions, newest activity first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/sessions/{id}:
    delete:
      tags: [me]
      summary: End one of this login's sessions
      operationId: revokeSession
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204": { description: Session ended. }
        "404": { $ref: "#/components/responses/Problem" }

  /me/2fa/setup:
    post:
      tags: [me]
      summary: Start enabling two-factor authentication
      description: Returns a new secret. 2FA is not active until `/me/2fa/confirm`.
      operationId: setup2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Secret to add to an authenticator app.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: { type: string, description: Base32, for manual entry }
                  otpauth_uri: { type: string, description: Payload for a QR code }
        "409": { $ref: "#/components/responses/Problem" }

  /me/2fa/confirm:
    post:
      tags: [me]
      summary: Activate 2FA with a code from the app
      operationId: confirm2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: 2FA is active. Show the recovery codes once.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string, examples: ["ABCDE-FGHIJ"] }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /me/2fa/disable:
    post:
      tags: [me]
      summary: Turn 2FA off (requires the password)
      operationId: disable2FA
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: 2FA disabled. }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /features:
    get:
      tags: [plans]
      summary: The feature catalog (admins)
      description: Every feature a feature list can turn on, in display order.
      operationId: listFeatures
      responses:
        "200":
          description: Features.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Feature" }
        "403": { $ref: "#/components/responses/Problem" }

  /feature-lists:
    get:
      tags: [plans]
      summary: List feature lists (admins)
      operationId: listFeatureLists
      responses:
        "200":
          description: Feature lists, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureList" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [plans]
      summary: Create a feature list
      operationId: createFeatureList
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureListInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureList" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /feature-lists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [plans]
      summary: Get a feature list
      operationId: getFeatureList
      responses:
        "200":
          description: The feature list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureList" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [plans]
      summary: Replace a feature list
      operationId: updateFeatureList
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureListInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [plans]
      summary: Delete a feature list
      operationId: deleteFeatureList
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /packages:
    get:
      tags: [plans]
      summary: List packages (admins)
      operationId: listPackages
      responses:
        "200":
          description: Packages, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Package" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [plans]
      summary: Create a package
      operationId: createPackage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /packages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [plans]
      summary: Get a package
      operationId: getPackage
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [plans]
      summary: Replace a package
      operationId: updatePackage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [plans]
      summary: Delete a package
      operationId: deletePackage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts:
    get:
      tags: [accounts]
      summary: List hosting accounts (admins)
      operationId: listAccounts
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Part of a username or domain }
        - { name: status, in: query, schema: { type: string, enum: [creating, active, suspended, terminating, error] } }
      responses:
        "200":
          description: Accounts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [accounts]
      summary: Create a hosting account
      description: Creates the account and its login; a job then creates the Linux user (status creating, then active).
      operationId: createAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "202":
          description: Created; setup continues in the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [accounts]
      summary: Get an account
      operationId: getAccount
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [accounts]
      summary: Change package and contact email
      operationId: updateAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "202":
          description: Saved; limits are re-applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/suspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Suspend an account
      operationId: suspendAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Accepted; the change runs as the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/unsuspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Unsuspend an account
      operationId: unsuspendAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Accepted; the change runs as the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Set the account login's password
      operationId: setAccountPassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 10 }
                must_change: { type: boolean }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/terminate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [accounts]
      summary: Terminate (delete) an account
      operationId: terminateAccount
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: string, description: Must equal the username }
      responses:
        "202":
          description: Accepted; the change runs as the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/domains:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domains]
      summary: List an account's domains, the primary first
      operationId: listDomains
      responses:
        "200":
          description: The domains.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Domain" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [domains]
      summary: Add an addon domain, subdomain or alias
      description: |
        `409 verification_required`: another account uses a domain under the
        same registered domain. Publish the TXT record from
        `GET /accounts/{id}/domain-verification` and try again.
        Other 409 codes: `domain_taken`, `limit_reached`, `bad_status`.
      operationId: addDomain
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainCreate" }
      responses:
        "202":
          description: Accepted; the websites are configured by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/domain-verification:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domains]
      summary: Whether adding a domain needs a TXT record, and which
      operationId: getDomainVerification
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The verification state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainVerification" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /domains/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [domains]
      summary: Change a domain's document root and canonical host
      operationId: updateDomain
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainUpdate" }
      responses:
        "202":
          description: Accepted; applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [domains]
      summary: Remove a domain and its redirects (files stay)
      description: "409 codes: `primary_domain`, `has_dependents` (remove its subdomains and aliases first), `bad_status`."
      operationId: deleteDomain
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Accepted; applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/redirects:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domains]
      summary: List the redirects of an account's domains
      operationId: listRedirects
      responses:
        "200":
          description: The redirects, by domain and path.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Redirect" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /domains/{id}/redirects:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [domains]
      summary: Add a redirect to a domain
      description: "409 codes: `redirect_exists`, `limit_reached` (100 per domain), `bad_status`."
      operationId: addRedirect
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedirectCreate" }
      responses:
        "202":
          description: Accepted; applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Redirect" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /redirects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [domains]
      summary: Remove a redirect
      operationId: deleteRedirect
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Accepted; applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /dns/zones:
    get:
      tags: [dns]
      summary: List zones (admins all, or one account's; users their own)
      operationId: listZones
      parameters:
        - { name: account_id, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: Part of the zone name (admins) }
      responses:
        "200":
          description: The zones, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Zone" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /dns/zones/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [dns]
      summary: A zone with its records
      operationId: getZone
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [dns]
      summary: Set who handles the zone's mail (USR-DNS-03)
      operationId: updateZone
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mail_routing]
              properties:
                mail_routing: { type: string, enum: [auto, local, remote, backup] }
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /dns/zones/{id}/records:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [dns]
      summary: Add a record
      description: "409 codes: `record_conflict` (the zone would be invalid, e.g. a CNAME next to other records), `record_exists`."
      operationId: addRecord
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "202":
          description: Accepted; served once the job in job_id has run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /dns/records/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [dns]
      summary: Replace a record
      operationId: updateRecord
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "202":
          description: Accepted; applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [dns]
      summary: Remove a record
      operationId: deleteRecord
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Accepted; applied by the job in job_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /server/dns:
    get:
      tags: [dns]
      summary: DNS settings, zone template and name server report (admins)
      operationId: getDNSSettings
      responses:
        "200":
          description: Settings and a check of the name servers in DNS.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/DNSSettings" }
                  - type: object
                    required: [report, detected_ips]
                    properties:
                      report:
                        type: array
                        items:
                          type: object
                          required: [name, addresses, ok]
                          properties:
                            name: { type: string }
                            addresses: { type: array, items: { type: string } }
                            ok: { type: boolean, description: Points to this server's IPv4 or IPv6 }
                            problem: { type: string }
                      detected_ips: { type: array, items: { type: string }, description: Addresses of the server's interfaces }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [dns]
      summary: Save DNS settings and re-apply every zone (admins)
      operationId: saveDNSSettings
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSSettings" }
      responses:
        "200":
          description: Saved; zones_queued zones are being re-applied.
          content:
            application/json:
              schema:
                type: object
                required: [settings, zones_queued]
                properties:
                  settings: { $ref: "#/components/schemas/DNSSettings" }
                  zones_queued: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/php-versions:
    get:
      tags: [system]
      summary: PHP-FPM versions installed on the server (admins)
      operationId: listPHPVersions
      responses:
        "200":
          description: Versions, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string, examples: ["8.3"] }
        "403": { $ref: "#/components/responses/Problem" }

  /jobs/{id}:
    get:
      tags: [system]
      summary: Status of a background job (admins; users for their own account's jobs)
      operationId: getJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Problem" }

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-xcp_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The `csrf_token` from the login response or `GET /me`. Required with the session cookie on state-changing requests.

  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    LoginResult:
      type: object
      required: [mfa_required, must_change_password, csrf_token]
      properties:
        mfa_required: { type: boolean }
        must_change_password: { type: boolean }
        csrf_token: { type: string }

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: "6-digit TOTP code or a recovery code" }

    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string }

    Me:
      type: object
      required: [id, username, role, email, locale, totp_enabled, must_change_password, csrf_token]
      properties:
        id: { type: string, description: ULID }
        username: { type: string }
        role: { type: string, enum: [admin, reseller, user, subuser] }
        email: { type: string }
        locale: { type: string }
        totp_enabled: { type: boolean }
        must_change_password: { type: boolean }
        impersonator_id: { type: string, description: Set while an admin or reseller is logged in as this user }
        account_id: { type: string, description: The hosting account of a user login }
        csrf_token: { type: string }

    Session:
      type: object
      required: [id, ip, user_agent, created_at, last_seen_at, current]
      properties:
        id: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }

    Feature:
      type: object
      required: [key, group]
      properties:
        key: { type: string, examples: [email] }
        group: { type: string, examples: [email] }

    FeatureList:
      type: object
      required: [id, name, features, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        features:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FeatureListInput:
      type: object
      additionalProperties: false
      required: [name, features]
      properties:
        name: { type: string, maxLength: 64 }
        features:
          type: array
          items: { type: string }

    Limits:
      type: object
      additionalProperties: false
      description: Resource limits. null means unlimited.
      properties:
        disk_mb: { type: [integer, "null"], minimum: 0, description: "Disk space in MB" }
        inodes: { type: [integer, "null"], minimum: 0, description: "Number of files" }
        bandwidth_mb: { type: [integer, "null"], minimum: 0, description: "Monthly traffic in MB" }
        addon_domains: { type: [integer, "null"], minimum: 0, description: "Addon domains" }
        subdomains: { type: [integer, "null"], minimum: 0, description: "Subdomains" }
        aliases: { type: [integer, "null"], minimum: 0, description: "Alias (parked) domains" }
        mailboxes: { type: [integer, "null"], minimum: 0, description: "Mailboxes" }
        mailbox_mb: { type: [integer, "null"], minimum: 0, description: "Largest quota of one mailbox, MB" }
        forwarders: { type: [integer, "null"], minimum: 0, description: "Mail forwarders" }
        mail_per_hour: { type: [integer, "null"], minimum: 0, description: "Outgoing mails per hour" }
        databases: { type: [integer, "null"], minimum: 0, description: "Databases" }
        db_users: { type: [integer, "null"], minimum: 0, description: "Database users" }
        ftp_accounts: { type: [integer, "null"], minimum: 0, description: "FTP accounts" }
        cron_jobs: { type: [integer, "null"], minimum: 0, description: "Cron jobs" }
        cpu_percent: { type: [integer, "null"], minimum: 0, description: "CPU, 100 = one core" }
        memory_mb: { type: [integer, "null"], minimum: 0, description: "Memory in MB" }
        processes: { type: [integer, "null"], minimum: 0, description: "Processes" }
        io_mbps: { type: [integer, "null"], minimum: 0, description: "Disk I/O in MB/s" }
        shell: { type: string, enum: [none, jailed, full] }
        php_versions:
          type: array
          description: Allowed PHP versions; empty means all installed.
          items: { type: string, pattern: "^[5-9]\\.[0-9]$" }
        dedicated_ip: { type: boolean }

    Package:
      type: object
      required: [id, name, feature_list_id, limits, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        feature_list_id: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PackageInput:
      type: object
      additionalProperties: false
      required: [name, feature_list_id, limits]
      properties:
        name: { type: string, maxLength: 64 }
        feature_list_id: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }

    Account:
      type: object
      required: [id, username, uid, primary_domain, email, php_version, package_id, package_name, status, status_detail, created_at, updated_at]
      properties:
        id: { type: string }
        username: { type: string }
        uid: { type: integer }
        primary_domain: { type: string }
        email: { type: string }
        php_version: { type: string, description: '"" = server default (newest installed)' }
        package_id: { type: string }
        package_name: { type: string }
        status: { type: string, enum: [creating, active, suspended, terminating, error] }
        status_detail: { type: string, description: Suspension reason or last error }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        job_id: { type: string, description: Job started by this change }

    AccountCreate:
      type: object
      additionalProperties: false
      required: [username, domain, package_id, password]
      properties:
        username: { type: string, pattern: "^[a-z][a-z0-9]{0,15}$" }
        domain: { type: string }
        package_id: { type: string }
        email: { type: string }
        password: { type: string, minLength: 10 }
        php_version: { type: string, description: 'Installed version the package allows; "" or omitted = server default' }

    AccountUpdate:
      type: object
      additionalProperties: false
      required: [package_id, email]
      properties:
        package_id: { type: string }
        email: { type: string }
        php_version: { type: string }

    Job:
      type: object
      required: [id, kind, status, progress, attempts, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        attempts: { type: integer }
        error: { type: string }
        result: { type: object, additionalProperties: true }
        account_id: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    JobRef:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string }

    Domain:
      type: object
      required: [id, account_id, name, display_name, kind, docroot, canonical, created_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        name: { type: string, description: 'ASCII (punycode); "*.example.com" for a wildcard subdomain' }
        display_name: { type: string, description: Unicode form of an internationalised name }
        kind: { type: string, enum: [primary, addon, sub, alias] }
        parent_id: { type: string, description: "sub: the domain it is under; alias: the domain whose site it shows" }
        parent_name: { type: string }
        docroot: { type: string, description: Relative to the home folder; for an alias, that of the site it shows }
        canonical: { type: string, enum: ["", www, bare], description: '"" serves both names; www or bare redirects to that form' }
        created_at: { type: string, format: date-time }
        job_id: { type: string, description: Job started by this change }

    DomainCreate:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [addon, sub, alias] }
        name: { type: string, description: 'addon/alias: the domain; sub: the part before the parent ("blog", or "*" for a wildcard)' }
        parent_id: { type: string, description: "sub and alias: the account's primary or addon domain" }
        docroot: { type: string, description: 'addon and sub, relative to the home folder; "" = domains/<name>' }

    DomainUpdate:
      type: object
      additionalProperties: false
      required: [docroot, canonical]
      properties:
        docroot: { type: string, description: Must be "" for an alias }
        canonical: { type: string, enum: ["", www, bare] }

    DomainVerification:
      type: object
      required: [name, required, record, value, verified]
      properties:
        name: { type: string }
        required: { type: boolean, description: Another account uses a domain under the same registered domain }
        record: { type: string, description: TXT record name to publish }
        value: { type: string, description: TXT record value }
        verified: { type: boolean, description: The record is visible in DNS now }

    Redirect:
      type: object
      required: [id, domain_id, domain, path, target, code, keep_path, created_at]
      properties:
        id: { type: string }
        domain_id: { type: string }
        domain: { type: string }
        path: { type: string, description: '"/" = the whole site' }
        target: { type: string }
        code: { type: integer, enum: [301, 302, 307, 308] }
        keep_path: { type: boolean, description: Append the rest of the requested path to the target }
        created_at: { type: string, format: date-time }
        job_id: { type: string }

    Zone:
      type: object
      required: [id, account_id, account, name, display_name, mail_routing, serving, updated_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        account: { type: string, description: The account's username }
        serving: { type: boolean, description: "The DNS server has the zone; false until PowerDNS has applied it" }
        name: { type: string }
        display_name: { type: string }
        mail_routing: { type: string, enum: [auto, local, remote, backup] }
        mail_routing_effective: { type: string, enum: [local, remote, backup], description: What auto resolves to from the MX records (detail only) }
        nameservers: { type: array, items: { type: string }, description: The zone's NS records (detail only) }
        records: { type: array, items: { $ref: "#/components/schemas/Record" }, description: Detail only }
        updated_at: { type: string, format: date-time }

    Record:
      type: object
      required: [id, zone_id, name, type, ttl, content, managed]
      properties:
        id: { type: string }
        zone_id: { type: string }
        name: { type: string, description: 'Relative to the zone: "@" for the zone itself' }
        type: { type: string, enum: [A, AAAA, CAA, CNAME, HTTPS, MX, NS, SRV, SVCB, TLSA, TXT] }
        ttl: { type: integer }
        content: { type: string, description: TXT as plain text; others in zone-file form }
        managed: { type: boolean, description: Made for a domain; removed with it }
        job_id: { type: string }

    RecordInput:
      type: object
      additionalProperties: false
      required: [name, type, content]
      properties:
        name: { type: string, description: '"@", "www", or a full name in the zone' }
        type: { type: string, enum: [A, AAAA, CAA, CNAME, HTTPS, MX, NS, SRV, SVCB, TLSA, TXT] }
        ttl: { type: integer, description: "Seconds, 60 to 604800; 0 or missing = the server's default" }
        content: { type: string, description: 'TXT: plain text. Others: zone-file form; for the host name, "@" is the zone, one label ("mail") is in the zone, a name with dots is complete' }

    DNSSettings:
      type: object
      required: [nameservers, ipv4, ipv6, ttl, template]
      properties:
        nameservers: { type: array, items: { type: string }, description: "NS of every zone; empty = ns1/ns2 of each zone" }
        ipv4: { type: string, description: "This server's public IPv4, used by the template" }
        ipv6: { type: string }
        ttl: { type: integer }
        template:
          type: array
          items:
            type: object
            required: [name, type, content]
            properties:
              name: { type: string }
              type: { type: string }
              content: { type: string, description: "May use {domain}, {ip4} and {ip6}" }

    RedirectCreate:
      type: object
      additionalProperties: false
      required: [path, target, code]
      properties:
        path: { type: string }
        target: { type: string, description: Absolute http(s) URL }
        code: { type: integer, enum: [301, 302, 307, 308] }
        keep_path: { type: boolean }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable error code.
          examples: [invalid_credentials, unauthenticated, mfa_required, invalid_code, csrf_failed, rate_limited, validation_failed, password_change_required, forbidden, name_taken, in_use, username_taken, domain_taken, bad_status]
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
