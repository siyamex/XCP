      tags: [databases]
      summary: Sign in to phpMyAdmin for the account's databases
      description: Returns a one-time URL (valid 2 minutes) on the host the request came to, port 443 (ADR-0006). Needs the `phpmyadmin` feature.
      operationId: phpMyAdminSignon
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /server/mysql:
    get:
      tags: [databases]
      summary: The database server and phpMyAdmin (admins)
      operationId: getMySQLStatus
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [installed]
                properties:
                  installed: { type: boolean }
                  version: { type: string }
                  phpmyadmin: { type: string, description: Installed version }
                  detail: { type: string }
        "403": { $ref: "#/components/responses/Problem" }

  /server/mysql/root-password:
    put:
      tags: [databases]
      summary: Set MariaDB's root password (admins)
      description: Root on the server keeps signing in through the socket; the password is for the admin's own tools.
      operationId: setMySQLRootPassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "204": { description: Set. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/mail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mail]
      summary: An account's mail domains, mailboxes and forwarders
      operationId: getMail
      responses:
        "200":
          description: Everything the mail page shows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailOverview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/mailboxes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mail]
      summary: Create a mailbox
      description: The domain's DKIM key is made with its first address and published in its zone when this server serves it.
      operationId: createMailbox
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain_id, local, password]
              properties:
                domain_id: { type: string }
                local: { type: string, description: The part before the @ }
                password: { type: string, format: password }
                quota_mb: { type: integer, description: 0 means the package's largest }
      responses:
        "202":
          description: Created; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /mailboxes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [mail]
      summary: Change a mailbox's quota and switches
      operationId: updateMailbox
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quota_mb, login, receive, send]
              properties:
                quota_mb: { type: integer }
                login: { type: boolean }
                receive: { type: boolean }
                send: { type: boolean }
      responses:
        "202":
          description: Changed; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [mail]
      summary: Delete a mailbox (its mail stays in the account's home)
      operationId: deleteMailbox
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /mailboxes/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [mail]
      summary: Change a mailbox's password
      operationId: setMailboxPassword
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "202":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /mailboxes/{id}/autoresponder:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [mail]
      summary: Set a mailbox's autoresponder
      operationId: setAutoresponder
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Autoresponder" }
      responses:
        "202":
          description: Set; the job in `job_id` applies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [mail]
      summary: Remove a mailbox's autoresponder
      operationId: deleteAutoresponder
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /mailboxes/{id}/webmail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mail]
      summary: Sign a mailbox in to webmail
      description: Returns a one-time URL (valid 2 minutes) on the host the request came to, port 443 (ADR-0008). Needs the `webmail` feature and login on.
      operationId: webmailSignon
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/forwarders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mail]
      summary: Create a forwarder (to addresses, or a rejection with a message)
      operationId: createForwarder
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain_id, local]
              properties:
                domain_id: { type: string }
                local: { type: string }
                to: { type: array, items: { type: string } }
                fail: { type: string, description: Set to reject with this message instead of forwarding }
                pipe: { type: string, description: Set to hand mail to this script (a path in the account's home), run as the account }
      responses:
        "202":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forwarder" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /forwarders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [mail]
      summary: Delete a forwarder
      operationId: deleteForwarder
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /domains/{id}/mail/catch-all:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [mail]
      summary: Set where mail to unknown addresses of a domain goes
      operationId: setCatchAll
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to: { type: array, items: { type: string }, description: Empty rejects unknown addresses }
      responses:
        "202":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /domains/{id}/mail/deliverability:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mail]
      summary: Check a domain's MX, SPF, DKIM, DMARC and the server's PTR in public DNS
      operationId: getDeliverability
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverability" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /domains/{id}/mail/repair:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mail]
      summary: Write the expected SPF, DKIM and DMARC records into the domain's zone here
      description: SPF and DMARC only when the zone has none; the DKIM key always. 409 no_zone when the domain's DNS is elsewhere.
      operationId: repairMailDNS
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Whether a record changed; the zone's job publishes them.
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /server/mail:
    get:
      tags: [mail]
      summary: Mail server settings (admins)
      operationId: getMailSettings
      responses:
        "200":
          description: The settings; the relay password is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSettings" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [mail]
      summary: Change the mail server settings (admins)
      operationId: putMailSettings
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hostname, max_message_mb]
              properties:
                hostname: { type: string }
                max_message_mb: { type: integer }
                relay_host: { type: string, description: 'host or host:port (587 by default); empty delivers directly' }
                relay_user: { type: string }
                relay_password: { type: string, format: password, description: Empty keeps the stored one }
                rbls: { type: array, items: { type: string } }
                helo_checks: { type: boolean }
                greylisting: { type: boolean }
      responses:
        "202":
          description: Saved; the job in `job_id` applies them.
          content:
            application/json:
              schema:
                type: object
                required: [settings, job_id]
                properties:
                  settings: { $ref: "#/components/schemas/MailSettings" }
                  job_id: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/firewall:
    get:
      tags: [server]
      summary: The firewall, the bans in force and the latest ban history
      operationId: getFirewall
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallOverview" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [server]
      summary: Change the firewall
      description: Your own address is put on the allow list when the change would shut you out.
      operationId: putFirewall
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirewallConfig" }
      responses:
        "200":
          description: Saved; the rules are applied by a job.
          content:
            application/json:
              schema: { type: object, required: [config, job_id, added_your_ip], properties: { config: { $ref: "#/components/schemas/FirewallConfig" }, job_id: { type: string }, added_your_ip: { type: boolean } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /server/firewall/bans:
    post:
      tags: [server]
      summary: Ban an address
      operationId: banIP
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ip], properties: { ip: { type: string }, minutes: { type: integer, description: 0 bans for good }, reason: { type: string } } }
      responses:
        "201":
          description: Banned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallBan" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /server/firewall/bans/{id}:
    delete:
      tags: [server]
      summary: Lift a ban
      operationId: unbanIP
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Lifted. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /server/settings:
    get:
      tags: [server]
      summary: Every global setting with its value
      operationId: getSettings
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/SettingItem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [server]
      summary: Change global settings
      operationId: putSettings
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [values], properties: { values: { type: object, additionalProperties: true, description: Setting key to new value; keys not named stay } } }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/SettingItem" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/setup:
    get:
      tags: [server]
      summary: The first-run setup
      operationId: getSetup
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSetup" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [server]
      summary: "Apply the setup (host name, time zone, admin email, DNS)"
      operationId: putSetup
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupInput" }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSetup" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /server/hostname:
    put:
      tags: [server]
      summary: Change the server's host name
      description: Sets the system name and /etc/hosts, the name AutoSSL gets a certificate for and the mail server's name. Run AutoSSL afterwards for the new name's certificate.
      operationId: putHostname
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [hostname], properties: { hostname: { type: string } } }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostnameResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /server/updates:
    get:
      tags: [server]
      summary: Whether a newer release exists
      description: Asks GitHub, at most once an hour. The panel does not install updates yet.
      operationId: getUpdates
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/reboot:
    post:
      tags: [server]
      summary: Reboot the server in a few seconds
      description: Needs the admin's password again.
      operationId: postReboot
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [mode, password], properties: { mode: { type: string, enum: [graceful, forced] }, password: { type: string, format: password } } }
      responses:
        "202":
          description: Done.
          content:
            application/json:
              schema: { type: object, required: [rebooting], properties: { rebooting: { type: boolean } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/rebuild:
    post:
      tags: [server]
      summary: Apply every account, DNS zone and the mail settings again
      operationId: postRebuild
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: Done.
          content:
            application/json:
              schema: { type: object, required: [queued], properties: { queued: { type: object, additionalProperties: { type: integer } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /server/backups:
    get:
      tags: [backups]
      summary: Backups of removed accounts
      operationId: listOrphanBackups
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/OrphanBackup" } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /server/backups/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [backups]
      summary: Rebuild a removed account from its backup
      description: Checks the whole archive first, then restores the account's settings, creates it, and puts back its files and databases. 409 when an account, domain or login of that name exists.
      operationId: restoreBackup
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { package_id: { type: string, description: "Default: the package of the same name as in the backup" } } }
      responses:
        "202":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /server/status:
    get:
      tags: [server]
      summary: Host load, memory, disks, network, top processes, accounts' disk use and versions
      operationId: getServerStatus
      responses:
        "200":
          description: The host now. Accounts' disk use is measured in the background and can be minutes old.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStatus" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/services:
    get:
      tags: [server]
      summary: The services and their state
      operationId: listServices
      responses:
        "200":
          description: Services in display order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ServiceState" } }
        "403": { $ref: "#/components/responses/Problem" }

  /server/services/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart, reload, enable, disable] } }
    post:
      tags: [server]
      summary: Start, stop, restart, reload, enable or disable a service
      description: The panel's API and SSH cannot be stopped, restarted or disabled here (409 protected).
      operationId: serviceAction
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Done; the service's state now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceState" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /server/services/{id}/log:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [server]
      summary: The last lines of a service's journal
      operationId: getServiceLog
      parameters:
        - { name: lines, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: The log text.
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /server/jobs:
    get:
      tags: [server]
      summary: The task queue, newest first
      operationId: listJobs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, failed, canceled] } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobItem" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /server/jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [server]
      summary: Cancel a queued or running job
      operationId: cancelJob
