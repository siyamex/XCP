                  items: { type: array, items: { $ref: "#/components/schemas/LoginAttempt" } }
        "403": { $ref: "#/components/responses/Problem" }

  /accounts/{id}/backups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [backups]
      summary: An account's backups, newest first
