// Contract between xcp-api / xcp-worker (unprivileged) and xcp-agent (root).
// See 01-architecture.md §3 and 07-security.md.
//
// Rules for every operation added here:
//   - Typed fields only. Never add an operation that takes a command line,
//     a shell snippet, or an arbitrary path to execute.
//   - The agent re-validates every field; the caller is not trusted.
//   - Operations are idempotent: repeating a call gives the same end state.
syntax = "proto3";

package xcp.agent.v1;

option go_package = "github.com/siyamex/XCP/internal/agentrpc/agentv1;agentv1";

service AgentService {
  // Ping reports that the agent is up, and its version.
  rpc Ping(PingRequest) returns (PingResponse);

  // ServiceStatus reports the state of a managed service.
  rpc ServiceStatus(ServiceStatusRequest) returns (ServiceStatusResponse);

  // ServiceAction starts, stops, restarts or reloads a managed service.
  rpc ServiceAction(ServiceActionRequest) returns (ServiceActionResponse);

  // FileWriteManaged writes a generated config file inside an allow-listed
  // directory, atomically. If a validator is given and fails, the previous
  // file is restored and the call fails with FAILED_PRECONDITION.
  rpc FileWriteManaged(FileWriteManagedRequest) returns (FileWriteManagedResponse);

  // FileRemoveManaged removes a generated config file (same rules as write).
  rpc FileRemoveManaged(FileRemoveManagedRequest) returns (FileRemoveManagedResponse);

  // AccountEnsure creates or updates the Linux side of a hosting account:
  // user and group, home folder layout, resource limits (systemd slice) and
  // disk quota where the filesystem supports it. Idempotent.
  rpc AccountEnsure(AccountEnsureRequest) returns (AccountEnsureResponse);

  // AccountSetSuspended locks or unlocks an account's Linux user.
  rpc AccountSetSuspended(AccountSetSuspendedRequest) returns (AccountSetSuspendedResponse);

  // AccountDelete stops the user's processes and removes the Linux user, its
  // home folder and its slice. It refuses users that XCP did not create.
  rpc AccountDelete(AccountDeleteRequest) returns (AccountDeleteResponse);

  // SiteApply writes an account's Apache virtual host and PHP-FPM pool. The
  // agent renders them from these typed fields (callers never send config
  // text, ADR-0004), runs apachectl -t and php-fpm -t, rolls back on failure
  // and reloads gracefully. NOT_FOUND: Apache or PHP-FPM is not installed.
  rpc SiteApply(SiteApplyRequest) returns (SiteApplyResponse);

  // SiteRemove deletes an account's virtual host and PHP-FPM pools.
  rpc SiteRemove(SiteRemoveRequest) returns (SiteRemoveResponse);

  // PHPVersions lists the installed PHP-FPM versions, oldest first.
  rpc PHPVersions(PHPVersionsRequest) returns (PHPVersionsResponse);
}

message PingRequest {}

message PingResponse {
  string version = 1;
  string hostname = 2;
}

// Services are named by logical ID, not by systemd unit, so callers do not
// depend on the OS. Examples: "web", "mta", "imap", "dns", "db", "ftp",
// "spam", "av", "ssh", "php-fpm@8.3". The agent maps IDs to units and
// rejects unknown IDs.
message ServiceStatusRequest {
  string service = 1;
}

message ServiceStatusResponse {
  string service = 1;
  string unit = 2;
  string active_state = 3;  // active, inactive, failed, activating, ...
  string sub_state = 4;     // running, dead, exited, ...
  int32 main_pid = 5;
  bool enabled = 6;         // starts at boot
}

enum ServiceActionKind {
  SERVICE_ACTION_KIND_UNSPECIFIED = 0;
  SERVICE_ACTION_KIND_START = 1;
  SERVICE_ACTION_KIND_STOP = 2;
  SERVICE_ACTION_KIND_RESTART = 3;
  SERVICE_ACTION_KIND_RELOAD = 4;
}

message ServiceActionRequest {
  string service = 1;
  ServiceActionKind action = 2;
}

message ServiceActionResponse {}

// Validators are fixed commands chosen by enum, never by the caller.
enum Validator {
  VALIDATOR_UNSPECIFIED = 0;  // no validation
  VALIDATOR_APACHE = 1;       // apachectl -t
  VALIDATOR_NGINX = 2;        // nginx -t
  VALIDATOR_POSTFIX = 3;      // postfix check
}

message FileWriteManagedRequest {
  // Absolute, clean path below one of the agent's managed directories.
  string path = 1;
  bytes content = 2;  // at most 4 MiB
  // Permission bits: only 0600, 0640 or 0644. Owner is always root.
  uint32 mode = 3;
  Validator validator = 4;
}

message FileWriteManagedResponse {
  // False when the file already had this content and mode (nothing written,
  // no validation run), so callers can skip reloading the service.
  bool changed = 1;
}

message FileRemoveManagedRequest {
  string path = 1;
  Validator validator = 2;
}

message FileRemoveManagedResponse {
  bool changed = 1;  // false if the file did not exist
}

enum Shell {
  SHELL_UNSPECIFIED = 0;  // treated as none
  SHELL_NONE = 1;         // no interactive login
  SHELL_JAILED = 2;       // jailed shell (bash until the jail exists, P3)
  SHELL_FULL = 3;
}

// Unset fields mean unlimited.
message ResourceLimits {
  optional uint32 cpu_percent = 1;  // 100 = one core
  optional uint64 memory_mb = 2;
  optional uint32 tasks = 3;        // processes and threads
  optional uint64 disk_mb = 4;      // filesystem quota, where supported
  optional uint64 inodes = 5;
}

message AccountEnsureRequest {
  string username = 1;        // validated like an XCP username
  uint32 uid = 2;             // 10000..59999, chosen by the panel
  Shell shell = 3;
  ResourceLimits limits = 4;
  string primary_domain = 5;  // shown on the default index page
}

message AccountEnsureResponse {
  bool created = 1;        // the Linux user was created by this call
  bool quota_applied = 2;  // false when the filesystem has no quota support
  string home = 3;
}

message AccountSetSuspendedRequest {
  string username = 1;
  bool suspended = 2;
  Shell shell = 3;  // restored on unsuspend
}

message AccountSetSuspendedResponse {}

message AccountDeleteRequest {
  string username = 1;
}

message AccountDeleteResponse {
  bool deleted = 1;  // false if the user did not exist
}

message SiteApplyRequest {
  string username = 1;
  uint32 uid = 2;
  repeated string domains = 3;  // first is the primary domain; www. aliases are added
  string php_version = 4;       // "" = newest installed
  bool suspended = 5;           // serve the suspended notice and run no PHP
  uint32 max_children = 6;      // PHP worker processes; 0 = default
}

message SiteApplyResponse {
  bool changed = 1;
  string php_version = 2;  // the version actually used
}

message SiteRemoveRequest {
  string username = 1;
}

message SiteRemoveResponse {
  bool changed = 1;
}

message PHPVersionsRequest {}

message PHPVersionsResponse {
  repeated string versions = 1;
}
