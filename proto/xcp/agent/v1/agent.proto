// Contract between xcp-api / xcp-worker (unprivileged) and xcp-agent (root).
// See 01-architecture.md §3 and 07-security.md.
//
// Rules for every operation added here:
//   - Typed fields only. Never add an operation that takes a command line,
//     a shell snippet, or an arbitrary path to execute.
//   - The agent re-validates every field; the caller is not trusted.
//   - Operations are idempotent: repeating a call gives the same end state.
syntax = "proto3";

package xcp.agent.v1;

option go_package = "github.com/siyamex/XCP/internal/agentrpc/agentv1;agentv1";

service AgentService {
  // Ping reports that the agent is up, and its version.
  rpc Ping(PingRequest) returns (PingResponse);

  // ServiceStatus reports the state of a managed service.
  rpc ServiceStatus(ServiceStatusRequest) returns (ServiceStatusResponse);

  // ServiceAction starts, stops, restarts or reloads a managed service.
  rpc ServiceAction(ServiceActionRequest) returns (ServiceActionResponse);

  // FileWriteManaged writes a generated config file inside an allow-listed
  // directory, atomically. If a validator is given and fails, the previous
  // file is restored and the call fails with FAILED_PRECONDITION.
  rpc FileWriteManaged(FileWriteManagedRequest) returns (FileWriteManagedResponse);

  // FileRemoveManaged removes a generated config file (same rules as write).
  rpc FileRemoveManaged(FileRemoveManagedRequest) returns (FileRemoveManagedResponse);

  // AccountEnsure creates or updates the Linux side of a hosting account:
  // user and group, home folder layout, resource limits (systemd slice) and
  // disk quota where the filesystem supports it. Idempotent.
  rpc AccountEnsure(AccountEnsureRequest) returns (AccountEnsureResponse);

  // AccountSetSuspended locks or unlocks an account's Linux user.
  rpc AccountSetSuspended(AccountSetSuspendedRequest) returns (AccountSetSuspendedResponse);

  // AccountDelete stops the user's processes and removes the Linux user, its
  // home folder and its slice. It refuses users that XCP did not create.
  rpc AccountDelete(AccountDeleteRequest) returns (AccountDeleteResponse);

  // SiteApply writes an account's Apache virtual host and PHP-FPM pool. The
  // agent renders them from these typed fields (callers never send config
  // text, ADR-0004), runs apachectl -t and php-fpm -t, rolls back on failure
  // and reloads gracefully. NOT_FOUND: Apache or PHP-FPM is not installed.
  rpc SiteApply(SiteApplyRequest) returns (SiteApplyResponse);

  // SiteRemove deletes an account's virtual host and PHP-FPM pools.
  rpc SiteRemove(SiteRemoveRequest) returns (SiteRemoveResponse);

  // PHPVersions lists the installed PHP-FPM versions, oldest first.
  rpc PHPVersions(PHPVersionsRequest) returns (PHPVersionsResponse);

  // DNSZoneApply makes PowerDNS serve exactly this zone: its records, NS
  // records from the name servers and an SOA kept by the agent. Only the
  // RRsets that differ change, in one transaction. NOT_FOUND: PowerDNS is
  // not installed.
  rpc DNSZoneApply(DNSZoneApplyRequest) returns (DNSZoneApplyResponse);

  // DNSZoneDelete removes a zone from PowerDNS.
  rpc DNSZoneDelete(DNSZoneDeleteRequest) returns (DNSZoneDeleteResponse);

  // HostCertificateInstall installs the certificate of the server's host
  // name (/etc/xcp/ssl/hostname.crt and .key) for the panel, and later mail
  // and FTP. It must cover the host name and be valid now; xcp-api picks it
  // up without a restart.
  rpc HostCertificateInstall(HostCertificateInstallRequest) returns (HostCertificateInstallResponse);

  // MariaDB (ADR-0006). The agent connects as root over the socket. Every
  // database and user name carries the account's prefix "<username>_",
  // checked by the agent. NOT_FOUND: MariaDB (or, for sign-on, phpMyAdmin)
  // is not installed.

  // MySQLStatus reports MariaDB's version and the installed phpMyAdmin.
  rpc MySQLStatus(MySQLStatusRequest) returns (MySQLStatusResponse);

  // MySQLAccountApply makes the account's users, password hashes, grants
  // and lock state exactly as given, and creates missing databases. It
  // never drops a database.
  rpc MySQLAccountApply(MySQLAccountApplyRequest) returns (MySQLAccountApplyResponse);

  // MySQLAccountRemove drops all databases and users of an account.
  rpc MySQLAccountRemove(MySQLAccountRemoveRequest) returns (MySQLAccountRemoveResponse);

  // MySQLDatabaseSizes lists the account's databases with their sizes.
  rpc MySQLDatabaseSizes(MySQLDatabaseSizesRequest) returns (MySQLDatabaseSizesResponse);

  // MySQLDatabaseDrop drops one database with its data.
  rpc MySQLDatabaseDrop(MySQLDatabaseDropRequest) returns (MySQLDatabaseDropResponse);

  // MySQLDatabaseRename moves all tables to a new database and drops the
  // old one. INVALID_ARGUMENT if it has views, triggers, routines or events.
  rpc MySQLDatabaseRename(MySQLDatabaseRenameRequest) returns (MySQLDatabaseRenameResponse);

  // MySQLSignon creates a temporary user for phpMyAdmin with all privileges
  // on the given databases and a one-time ticket to sign in with it.
  rpc MySQLSignon(MySQLSignonRequest) returns (MySQLSignonResponse);

  // MySQLSignonExpire drops expired sign-on users and unused tickets.
  rpc MySQLSignonExpire(MySQLSignonExpireRequest) returns (MySQLSignonExpireResponse);

  // MySQLRootPassword lets root in with a password too (next to the socket).
  rpc MySQLRootPassword(MySQLRootPasswordRequest) returns (MySQLRootPasswordResponse);

  // Mail (ADR-0007). NOT_FOUND: the mail server is not installed.

  // MailAccountApply stores an account's mail (domains, mailboxes,
  // forwarders, default addresses, DKIM keys) and rebuilds the global
  // maps. INVALID_ARGUMENT if another account has mail for one of its domains.
  rpc MailAccountApply(MailAccountApplyRequest) returns (MailAccountApplyResponse);

  // MailAccountRemove drops an account's mail from the maps.
  rpc MailAccountRemove(MailAccountRemoveRequest) returns (MailAccountRemoveResponse);

  // MailSettingsApply renders the mail servers' configuration.
  rpc MailSettingsApply(MailSettingsApplyRequest) returns (MailSettingsApplyResponse);

  // MailWebmailSignon makes a temporary IMAP password (8 hours) for a
  // mailbox of the account that may log in, and a one-time ticket for
  // Roundcube (ADR-0008). NOT_FOUND: webmail is not installed.
  rpc MailWebmailSignon(MailWebmailSignonRequest) returns (MailWebmailSignonResponse);

  // MailWebmailExpire drops expired temporary passwords and tickets.
  rpc MailWebmailExpire(MailWebmailExpireRequest) returns (MailWebmailExpireResponse);

  // UserHelperStart starts an account's file helper socket (ADR-0009):
  // xcp-userd then runs as the account's user on the first connection.
  // FAILED_PRECONDITION: not an XCP account.
  rpc UserHelperStart(UserHelperStartRequest) returns (UserHelperStartResponse);

  // FTP (ADR-0010). NOT_FOUND: the FTP server is not installed.

  // FTPAccountApply stores all FTP logins of an account for xcp-ftpauth,
  // after making their folders as the account's user. INVALID_ARGUMENT if
  // another account has one of the logins.
  rpc FTPAccountApply(FTPAccountApplyRequest) returns (FTPAccountApplyResponse);

  // FTPAccountRemove drops an account's FTP logins.
  rpc FTPAccountRemove(FTPAccountRemoveRequest) returns (FTPAccountRemoveResponse);

  // Cron (ADR-0011).

  // CronAccountApply stores all cron jobs of an account; the agent starts
  // the due ones every minute as transient units in the account's slice.
  rpc CronAccountApply(CronAccountApplyRequest) returns (CronAccountApplyResponse);

  // CronAccountRemove drops an account's cron jobs and their last runs.
  rpc CronAccountRemove(CronAccountRemoveRequest) returns (CronAccountRemoveResponse);

  // CronStatus returns the last run of each of an account's jobs.
  rpc CronStatus(CronStatusRequest) returns (CronStatusResponse);
}

message PingRequest {}

message PingResponse {
  string version = 1;
  string hostname = 2;
}

// Services are named by logical ID, not by systemd unit, so callers do not
// depend on the OS. Examples: "web", "mta", "imap", "dns", "db", "ftp",
// "spam", "av", "ssh", "php-fpm@8.3". The agent maps IDs to units and
// rejects unknown IDs.
message ServiceStatusRequest {
  string service = 1;
}

message ServiceStatusResponse {
  string service = 1;
  string unit = 2;
  string active_state = 3;  // active, inactive, failed, activating, ...
  string sub_state = 4;     // running, dead, exited, ...
  int32 main_pid = 5;
  bool enabled = 6;         // starts at boot
}

enum ServiceActionKind {
  SERVICE_ACTION_KIND_UNSPECIFIED = 0;
  SERVICE_ACTION_KIND_START = 1;
  SERVICE_ACTION_KIND_STOP = 2;
  SERVICE_ACTION_KIND_RESTART = 3;
  SERVICE_ACTION_KIND_RELOAD = 4;
}

message ServiceActionRequest {
  string service = 1;
  ServiceActionKind action = 2;
}

message ServiceActionResponse {}

// Validators are fixed commands chosen by enum, never by the caller.
enum Validator {
  VALIDATOR_UNSPECIFIED = 0;  // no validation
  VALIDATOR_APACHE = 1;       // apachectl -t
  VALIDATOR_NGINX = 2;        // nginx -t
  VALIDATOR_POSTFIX = 3;      // postfix check
}

message FileWriteManagedRequest {
  // Absolute, clean path below one of the agent's managed directories.
  string path = 1;
  bytes content = 2;  // at most 4 MiB
  // Permission bits: only 0600, 0640 or 0644. Owner is always root.
  uint32 mode = 3;
  Validator validator = 4;
}

message FileWriteManagedResponse {
  // False when the file already had this content and mode (nothing written,
  // no validation run), so callers can skip reloading the service.
  bool changed = 1;
}

message FileRemoveManagedRequest {
  string path = 1;
  Validator validator = 2;
}

message FileRemoveManagedResponse {
  bool changed = 1;  // false if the file did not exist
}

enum Shell {
  SHELL_UNSPECIFIED = 0;  // treated as none
  SHELL_NONE = 1;         // no interactive login
  SHELL_JAILED = 2;       // jailed shell (bash until the jail exists, P3)
  SHELL_FULL = 3;
}

// Unset fields mean unlimited.
message ResourceLimits {
  optional uint32 cpu_percent = 1;  // 100 = one core
  optional uint64 memory_mb = 2;
  optional uint32 tasks = 3;        // processes and threads
  optional uint64 disk_mb = 4;      // filesystem quota, where supported
  optional uint64 inodes = 5;
}

message AccountEnsureRequest {
  string username = 1;        // validated like an XCP username
  uint32 uid = 2;             // 10000..59999, chosen by the panel
  Shell shell = 3;
  ResourceLimits limits = 4;
  string primary_domain = 5;  // shown on the default index page
}

message AccountEnsureResponse {
  bool created = 1;        // the Linux user was created by this call
  bool quota_applied = 2;  // false when the filesystem has no quota support
  string home = 3;
}

message AccountSetSuspendedRequest {
  string username = 1;
  bool suspended = 2;
  Shell shell = 3;  // restored on unsuspend
}

message AccountSetSuspendedResponse {}

message AccountDeleteRequest {
  string username = 1;
}

message AccountDeleteResponse {
  bool deleted = 1;  // false if the user did not exist
}

message SiteApplyRequest {
  reserved 3;
  reserved "domains";
  string username = 1;
  uint32 uid = 2;
  string php_version = 4;   // "" = newest installed
  bool suspended = 5;       // serve the suspended notice and run no PHP
  uint32 max_children = 6;  // PHP worker processes; 0 = default
  // One virtual host per domain, the primary domain first. Each also answers
  // to www.<name>, except a wildcard ("*.example.com").
  repeated VirtualHost vhosts = 7;
}

// VirtualHost is the website of one domain.
message VirtualHost {
  string name = 1;
  string doc_root = 2;  // relative to the home folder; created when missing
  Canonical canonical = 3;
  repeated Redirect redirects = 4;
  TLS tls = 5;           // also serve it over HTTPS; unset = HTTP only
  bool force_https = 6;  // HTTP redirects to HTTPS (needs tls)
}

// TLS is a certificate and its private key. The agent checks that they
// match and that the certificate covers the name.
message TLS {
  string cert_pem = 1;  // the certificate, then the rest of its chain
  string key_pem = 2;
}

// Canonical is the host name a site sends its visitors to.
enum Canonical {
  CANONICAL_UNSPECIFIED = 0;  // none: serve name and www.name alike
  CANONICAL_WWW = 1;          // redirect name to www.name
  CANONICAL_BARE = 2;         // redirect www.name to name
}

// Redirect sends requests for a path (and everything below it) to a URL.
message Redirect {
  string path = 1;     // "/" = the whole site
  string target = 2;   // absolute http(s) URL
  uint32 code = 3;     // 301, 302, 307 or 308
  bool keep_path = 4;  // append the rest of the requested path to target
}

message SiteApplyResponse {
  bool changed = 1;
  string php_version = 2;  // the version actually used
}

message SiteRemoveRequest {
  string username = 1;
}

message SiteRemoveResponse {
  bool changed = 1;
}

message PHPVersionsRequest {}

message PHPVersionsResponse {
  repeated string versions = 1;
}

message DNSZoneApplyRequest {
  string zone = 1;                  // "example.com"
  repeated string nameservers = 2;  // the first is the primary in the SOA
  string hostmaster = 3;            // SOA mailbox as a name: "hostmaster.example.com"
  repeated DNSRecord records = 4;   // without SOA and the zone's own NS records
}

// DNSRecord is one record in its stored form (internal/dnsrr).
message DNSRecord {
  string name = 1;     // fully qualified, without the final dot
  string type = 2;
  uint32 ttl = 3;
  string content = 4;  // presentation format; TXT as quoted strings
}

message DNSZoneApplyResponse {
  bool changed = 1;
}

message DNSZoneDeleteRequest {
  string zone = 1;
}

message DNSZoneDeleteResponse {
  bool deleted = 1;  // false if PowerDNS did not have the zone
}

message HostCertificateInstallRequest {
  string hostname = 1;
  TLS tls = 2;
}

message HostCertificateInstallResponse {
  bool changed = 1;
}

message MySQLStatusRequest {}

message MySQLStatusResponse {
  string version = 1;     // MariaDB's
  string phpmyadmin = 2;  // installed phpMyAdmin version, empty if none
}

message MySQLAccountApplyRequest {
  string username = 1;
  repeated string databases = 2;  // full names: <username>_<name>
  repeated MySQLUser users = 3;
  bool locked = 4;                // suspended: users locked, sign-on users dropped
}

message MySQLUser {
  string name = 1;
  string password_hash = 2;  // mysql_native_password: "*" and 40 hex digits
  repeated MySQLGrant grants = 3;
}

message MySQLGrant {
  string database = 1;
  repeated string privileges = 2;  // "ALL", or names like "SELECT"
}

message MySQLAccountApplyResponse {
  bool changed = 1;
}

message MySQLAccountRemoveRequest {
  string username = 1;
}

message MySQLAccountRemoveResponse {
  uint32 databases = 1;
  uint32 users = 2;
}

message MySQLDatabaseSizesRequest {
  string username = 1;
}

message MySQLDatabaseSizesResponse {
  map<string, int64> sizes = 1;  // database -> bytes of data and indexes
}

message MySQLDatabaseDropRequest {
  string username = 1;
  string database = 2;
}

message MySQLDatabaseDropResponse {
  bool dropped = 1;  // false if it did not exist
}

message MySQLDatabaseRenameRequest {
  string username = 1;
  string from = 2;
  string to = 3;
}

message MySQLDatabaseRenameResponse {}

message MySQLSignonRequest {
  string username = 1;
  repeated string databases = 2;
}

message MySQLSignonResponse {
  string ticket = 1;  // for /phpmyadmin/xcp-signon.php?ticket=
}

message MySQLSignonExpireRequest {}

message MySQLSignonExpireResponse {
  uint32 dropped = 1;
}

message MySQLRootPasswordRequest {
  string password_hash = 1;
}

message MySQLRootPasswordResponse {}

message MailAccountApplyRequest {
  string username = 1;  // the agent looks up its uid and gid
  repeated MailDomain domains = 2;
}

message MailDomain {
  string name = 1;
  string routing = 2;   // "local" or "backup"
  string alias_of = 3;  // set: an alias domain of this one
  repeated Mailbox mailboxes = 4;
  repeated MailForwarder forwarders = 5;
  repeated string catch_all = 6;  // where unknown addresses go; empty rejects
  string dkim_key = 7;            // PEM; empty: no signing
}

message Mailbox {
  string local = 1;
  string password_hash = 2;  // {ARGON2ID}...
  int64 quota_mb = 3;        // 0: no limit
  bool login = 4;
  bool receive = 5;
  bool send = 6;
  MailAutoresponder autoresponder = 7;  // unset: none
}

message MailAutoresponder {
  string subject = 1;
  string body = 2;
  string start = 3;  // YYYY-MM-DD; empty: from now
  string end = 4;    // YYYY-MM-DD, inclusive; empty: until removed
  int32 days = 5;    // at most one reply per sender in this many days
}

message MailForwarder {
  string local = 1;
  repeated string to = 2;
  string fail = 3;  // set: reject with this message
  string pipe = 4;  // set: run this script (relative to the account's home) as the account user
}

message MailAccountApplyResponse {
  bool changed = 1;
}

message MailAccountRemoveRequest {
  string username = 1;
}

message MailAccountRemoveResponse {
  bool removed = 1;
}

message MailSettingsApplyRequest {
  string hostname = 1;
  int64 max_message_mb = 2;
  string relay_host = 3;
  string relay_user = 4;
  string relay_password = 5;
  repeated string rbls = 6;
  bool helo_checks = 7;
  bool greylisting = 8;
}

message MailSettingsApplyResponse {
  bool changed = 1;
}

message MailWebmailSignonRequest {
  string username = 1;
  string address = 2;
}

message MailWebmailSignonResponse {
  string ticket = 1;  // for /webmail/?_xcp_ticket=
}

message MailWebmailExpireRequest {}

message MailWebmailExpireResponse {}

message UserHelperStartRequest {
  string username = 1;
}

message UserHelperStartResponse {
  string socket = 1;  // where the helper listens
}

message FTPLogin {
  string login = 1;          // name@domain
  string password_hash = 2;  // {ARGON2ID}...
  string dir = 3;            // relative to the home; "." is the home
  int64 quota_mb = 4;        // 0: none of its own
}

message FTPAccountApplyRequest {
  string username = 1;
  repeated FTPLogin logins = 2;  // empty for a suspended account
}

message FTPAccountApplyResponse {
  bool changed = 1;
  repeated string problems = 2;  // logins whose folder could not be made; they cannot log in until it is usable
}

message FTPAccountRemoveRequest {
  string username = 1;
}

message FTPAccountRemoveResponse {
  bool removed = 1;
}

message CronJob {
  string id = 1;        // lower-case letters and digits
  string schedule = 2;  // 5 fields
  string command = 3;   // one line, run with /bin/sh as the account's user
  string mail_to = 4;   // empty: output is kept only
}

message CronAccountApplyRequest {
  string username = 1;
  repeated CronJob jobs = 2;  // empty for a suspended account
}

message CronAccountApplyResponse {
  bool changed = 1;
}

message CronAccountRemoveRequest {
  string username = 1;
}

message CronAccountRemoveResponse {
  bool removed = 1;
}

message CronStatusRequest {
  string username = 1;
}

message CronRun {
  string job_id = 1;
  int64 start_unix = 2;
  int64 duration_ms = 3;
  int32 exit_code = 4;
  string output = 5;   // the last 16 KiB
  string skipped = 6;  // set when the run did not start, and why
}

message CronStatusResponse {
  repeated CronRun runs = 1;
}
